services:
  - type: web
    name: saleseasy-lite-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt -c requirements.lock.txt
    startCommand: python -m uvicorn main:create_app --factory --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: RATE_LIMIT_PER_IP
        value: 5
      - key: RATE_LIMIT_GLOBAL
        value: 5
      - key: RATE_WINDOW_SECONDS
        value: 60
      - key: MAX_CONCURRENT_ANALYSES
        value: 2
